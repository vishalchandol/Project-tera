apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default

spec:
  replicas: 1
  selector:
    matchLabels:
      servicename: nginx
  template:
    metadata:
      labels:
        servicename: nginx 

    spec:
      containers:
      - name: nginx_cont
        image: nginx:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-html
        configMap:
          name: nginx-config