apiVersion: v1
kind: Service 
metadata:
  name: nginx-service
  namespace: default

spec:
  selector:
    servicename: nginx
  type: NodePort
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080

--- 
apiVersion: v1 
kind: Service 
metadata:
  name: apache-service
  namespace: default

spec:
  selector:
    servicename: apache
  type: NodePort
  ports: 
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30081
---

apiVersion: v1 
kind: LimitRange
metadata:
  name: prod-limit

spec:
  limits:
    - default:
        cpu: 1
        memory: 1Gi
---
