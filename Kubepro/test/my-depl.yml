# kubectl config set-context --current --namespace=<namespace-name>
# kubelet runs on node listens on port 10255


apiVersion: v1 
kind: PersistentVolume
metadata:
  name: apache-mypv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  hostPath:
    path: /mnt/data/apache

--- 

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 0.5Gi

---
# Deployment for apache

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-depl
  labels:
    app: apache-depl-lb

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: apache-depl-lb
  template:
    metadata:
      name: my-apache-temp
      labels:
        app: apache-depl-lb
    spec:
      containers:
        - name: apache
          image: httpd:latest
          ports:
            - containerPort: 80
          resources: 
            limits:
              cpu: "500m"
              memory: "128Mi" 
          volumeMounts:
            - mountPath: "/usr/local/apache2/"
              name: apache-storage
      volumes:
        - name: apache-storage
          persistentVolumeClaim: 
            claimName: apache-pvc
