version: "3.9"
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dockng
    ports:
      - "8080:80"
    deploy:
      replicas: 2
      update_config:
        parallelism: 2
        delay: 10s  
    volumes:
      - web-data:/usr/share/nginx/html
  apache:
    build:
      context: ./apache
      dockerfile: Dockerfile 
    container_name: dockapa
    ports:
      - "8081:80"
    deploy:
      replicas: 2
      update_config:
        parallelism: 2
        delay: 10s

volumes:
  web-data:
