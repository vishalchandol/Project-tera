name: Terraform Destroy

on:
  workflow_dispatch:  # Manual trigger via GitHub Actions UI
    inputs:
      environment:
        description: 'The environment to destroy (prod, staging, dev)'
        required: true
        default: 'dev'

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
       AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
       AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.0

      - name: Set Environment Variable
        run: echo "ENV=${{ inputs.environment }}" >> $GITHUB_ENV

      - name: Change to Terraform Directory
        run: |
          cd MYoffice
          ls -l  # Debugging step to check files
      
      ##
      
      - name: Check if Terraform State Exists
        id: check_state
        run: |
           if curl -sSf "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | grep -q terraform-state; then
             echo "FOUND=true" >> $GITHUB_ENV
           else
             echo "FOUND=false" >> $GITHUB_ENV
           fi

      - name: Download Terraform State (if exists)
        if: env.FOUND == 'true'
        uses: actions/download-artifact@v4
        with:
           name: terraform-state
           path: MYoffice
           

      ##
      - name: Terraform Init
        run: |
          cd MYoffice
          terraform init

      - name: Terraform Destroy
        run: |
          cd MYoffice
          terraform destroy -auto-approve -input=false -var-file=${{ env.ENV }}/terraform.tfvars
