name: Terraform Destroy

on:
  workflow_dispatch:  # Manual trigger via GitHub Actions UI
    inputs:
      environment:
        description: 'The environment to destroy (prod, staging, dev)'
        required: true
        default: 'dev'

permissions:
  actions: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
       AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
       AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.0

      - name: Set Environment Variable
        run: echo "ENV=${{ inputs.environment }}" >> $GITHUB_ENV

      - name: Change to Terraform Directory
        run: |
          cd MYoffice
          ls -l  # Debugging step to check files
      
      ## ✅ Fetch Latest Artifact Metadata ##
      - name: Fetch Artifact Metadata
        id: artifact_metadata
        run: |
          ARTIFACT_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
            jq -r '[.artifacts[] | select(.name=="terraform-state") | .id] | last // empty')

          if [[ -n "$ARTIFACT_ID" ]]; then
            echo "FOUND=true" >> $GITHUB_ENV
            echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV
          else
            echo "FOUND=false" >> $GITHUB_ENV
          fi

      - name: Debug Artifact ID
        run: |
          echo "Artifact ID: ${{ env.ARTIFACT_ID }}"

      ## ✅ Download Terraform State if Exists ##
      - name: Download Terraform State (if exists)
        if: env.FOUND == 'true'
        run: |
          echo "Downloading artifact with ID: ${{ env.ARTIFACT_ID }}"
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -o terraform-state.zip \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ env.ARTIFACT_ID }}/zip"
          mkdir -p MYoffice && unzip terraform-state.zip -d MYoffice

      ## ✅ Terraform Operations ##
      - name: Terraform Init
        run: |
          cd MYoffice
          terraform init

      - name: Terraform Destroy
        run: |
          cd MYoffice
          terraform destroy -auto-approve -input=false -var-file=${{ env.ENV }}/terraform.tfvars

      - name: Delete Old Terraform Artifact
        continue-on-error: true
        run: |
          ARTIFACT_IDS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
            jq -r '[.artifacts[] | select(.name=="terraform-state") | .id] | join(" ")')

          echo "Found artifacts: $ARTIFACT_IDS"

          if [ -n "$ARTIFACT_IDS" ]; then
            for ARTIFACT_ID in $ARTIFACT_IDS; do
              echo "Deleting artifact ID: $ARTIFACT_ID"
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
              echo "Deleted artifact ID: $ARTIFACT_ID"
            done
          else
            echo "No terraform-state artifact found to delete."
          fi
