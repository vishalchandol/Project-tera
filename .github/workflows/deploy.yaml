name: Terraform Deployment

on:
  push:
    branches:
      - main
      - staging
      - dev
#t ch
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: write  #  Allows deleting artifacts
      contents: read  # Default read access for repo contents
    env:
       AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
       AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.0

      - name: Determine Environment Based on Branch
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Change to Terraform Directory
        run: |
          cd MYoffice
          ls -l  # Debugging step to check files

      - name: Check if Terraform State Exists
        id: check_state
        run: |
          ARTIFACTS=$(curl -sSf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")
          
          RUN_ID=$(echo "$ARTIFACTS" | jq -r '[.artifacts[] | select(.name=="terraform-state") | .workflow_run.id] | max')

          if [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]]; then
            echo "FOUND=true" >> $GITHUB_ENV
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            echo "FOUND=true"
          else
            echo "FOUND=false" >> $GITHUB_ENV
            echo "FOUND=false"
          fi

      - name: Download Terraform State (if exists)
        if: env.FOUND == 'true'
        uses: dawidd6/action-download-artifact@v3
        with:
          name: terraform-state
          path: MYoffice
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ env.RUN_ID }}

      - name: Terraform Init
        run: |
          cd MYoffice
          terraform init

      - name: Terraform Validate
        run: |
          cd MYoffice
          terraform validate

      - name: Terraform Plan
        run: |
          cd MYoffice
          terraform plan -out=tfplan -var-file=${{ env.ENV }}/terraform.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          cd MYoffice
          terraform apply -auto-approve tfplan

      - name: Delete Old Terraform Artifact
        continue-on-error: true
        run: |
          ARTIFACTS=$(curl -sSf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")

          ARTIFACT_IDS=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name=="terraform-state") | .id' | sort -nr | tail -n +2)

          if [[ -n "$ARTIFACT_IDS" ]]; then
            for ID in $ARTIFACT_IDS; do
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID"
              echo "Deleted old artifact ID: $ID"
            done
          else
            echo "No old terraform-state artifacts to delete."
          fi

      - name: Upload Terraform State
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
           name: terraform-state
           path: MYoffice/terraform.tfstate
