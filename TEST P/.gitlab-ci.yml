stages:
  - init
  - plan
  - apply

variables:
  TF_VERSION: "1.5.7"       # Specify the Terraform version
  TF_WORKING_DIR: "infra"   # Directory containing Terraform files
  AWS_REGION: "us-east-1"   # Set your AWS region

init:
  stage: init
  image: hashicorp/terraform:${TF_VERSION}
  script:
    - terraform init ${TF_WORKING_DIR}
  only:
    - main                  # Run only on pushes to the main branch

plan:
  stage: plan
  image: hashicorp/terraform:${TF_VERSION}
  script:
    - terraform plan -out=tfplan ${TF_WORKING_DIR}
  only:
    - main

apply:
  stage: apply
  image: hashicorp/terraform:${TF_VERSION}
  script:
    - terraform apply -auto-approve tfplan
  only:
    - main
